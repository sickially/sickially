<svg width="100%" height="6" viewBox="0 0 1000 6" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente que suaviza nas extremidades para combinar com o estilo tradicional -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DB1C0D" stop-opacity="0" />
      <stop offset="15%" stop-color="#DB1C0D" stop-opacity="1" />
      <stop offset="85%" stop-color="#DB1C0D" stop-opacity="1" />
      <stop offset="100%" stop-color="#DB1C0D" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="100%" height="4" y="1" rx="2" fill="url(#redGradient)" />
</svg>
