<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 45" width="900" height="45">
  <style>
    @keyframes brushStroke {
      0% { transform: scaleX(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: scaleX(1); opacity: 1; }
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(5px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .section-brush {
      fill: #DB1C0D;
      transform-origin: left center;
      animation: brushStroke 1s ease-out both;
      opacity: 0.8;
    }
    .section-title {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 22px;
      fill: #ffffff;
      letter-spacing: 4px;
      animation: fadeIn 0.8s ease-out 0.3s both;
    }
    .section-jp {
      font-family: 'Segoe UI', serif;
      font-size: 14px;
      fill: #DB1C0D;
      opacity: 0.5;
      animation: fadeIn 0.8s ease-out 0.5s both;
    }
    .section-line {
      stroke: #DB1C0D;
      stroke-width: 1;
      opacity: 0.3;
      transform-origin: left center;
      animation: brushStroke 1.2s ease-out 0.5s both;
    }
  </style>
  <rect width="900" height="45" fill="transparent"/>
  <!-- Brush stroke accent -->
  <rect class="section-brush" x="0" y="32" width="180" height="3" rx="1"/>
  <!-- Title -->
  <text class="section-title" x="5" y="26">自己紹介</text>
  <text class="section-title" x="100" y="26">—</text>
  <text class="section-title" x="125" y="26">ABOUT ME</text>
  <!-- Decorative line -->
  <line class="section-line" x1="340" y1="22" x2="900" y2="22"/>
</svg>
