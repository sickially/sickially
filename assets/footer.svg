<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141022"/>
      <stop offset="100%" stop-color="#0e0a17"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.25); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
    }
    @keyframes footerJp {
      0%, 42% { opacity: 1; transform: translateY(0); }
      48%, 94% { opacity: 0; transform: translateY(-2px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes footerEn {
      0%, 42% { opacity: 0; transform: translateY(2px); }
      48%, 94% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(2px); }
    }
    .heart-icon { animation: heartbeat 2.2s ease-in-out infinite; transform-origin: 450px 78px; }
    .ft-jp { animation: footerJp 9s ease-in-out infinite; }
    .ft-en { animation: footerEn 9s ease-in-out infinite; }
  </style>

  <rect width="900" height="130" rx="10" fill="url(#footerBg)" stroke="#261d38" stroke-width="1"/>

  <!-- Subtle floating petals in footer -->
  <circle cx="150" cy="40" r="2.5" fill="#C084FC" opacity="0.3"/>
  <circle cx="750" cy="50" r="3" fill="#C084FC" opacity="0.25"/>
  <circle cx="820" cy="85" r="2" fill="#D8B4FE" opacity="0.2"/>
  <circle cx="90" cy="95" r="2.5" fill="#D8B4FE" opacity="0.25"/>

  <!-- Motto with translation -->
  <g class="ft-jp">
    <text x="450" y="42" text-anchor="middle" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', serif" font-size="13" letter-spacing="4">
      焦らず、歩みを止めず  •  七転び八起き
    </text>
  </g>
  <g class="ft-en">
    <text x="450" y="42" text-anchor="middle" fill="#DDD6FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" letter-spacing="4" font-weight="600">
      TAKE YOUR TIME  •  NEVER STOP LEARNING
    </text>
  </g>

  <!-- Animated Blossom -->
  <g class="heart-icon">
    <text x="450" y="82" text-anchor="middle" font-size="18">🌸</text>
  </g>

  <!-- Brand Signature -->
  <text x="450" y="112" text-anchor="middle" fill="#A79BB7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" letter-spacing="3" font-weight="500">
    SICKIALLY  ©  2026
  </text>
</svg>
