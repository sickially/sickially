<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140">
  <defs>
    <linearGradient id="footerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0505"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes fadeUp {
      0% { transform: translateY(10px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes sakuraFloat {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 0.6; }
      50%  { transform: translate(15px, -8px) rotate(180deg); opacity: 0.4; }
      100% { transform: translate(30px, 0) rotate(360deg); opacity: 0.6; }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.2); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
    }
    @keyframes waveScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-80px); }
    }
    
    .footer-bg { rx: 8; }
    
    .trans-stripe { animation: fadeUp 0.5s ease-out both; }
    
    .footer-text {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 13px;
      fill: #555;
      letter-spacing: 5px;
      text-transform: uppercase;
      animation: fadeUp 0.8s ease-out 0.3s both;
    }
    .footer-kanji {
      font-family: 'Segoe UI', serif;
      font-size: 14px;
      fill: #DB1C0D;
      opacity: 0.4;
      animation: fadeUp 0.8s ease-out 0.5s both;
    }
    .footer-brand {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 14px;
      fill: #DB1C0D;
      opacity: 0.6;
      letter-spacing: 3px;
      animation: fadeUp 0.8s ease-out 0.7s both;
    }
    .footer-heart {
      animation: heartbeat 2s ease-in-out infinite;
      transform-origin: center;
    }
    .float-petal {
      fill: #DB1C0D;
      animation: sakuraFloat 8s ease-in-out infinite;
    }
    
    .wave-pattern {
      opacity: 0.06;
      animation: waveScroll 8s linear infinite;
    }
  </style>
  
  <rect class="footer-bg" width="900" height="140" fill="url(#footerGrad)"/>
  
  <!-- Trans flag stripe at top -->
  <g class="trans-stripe">
    <rect x="0" y="0" width="900" height="2.5" fill="#5BCEFA" opacity="0.6"/>
    <rect x="0" y="2.5" width="900" height="2.5" fill="#F5A9B8" opacity="0.6"/>
    <rect x="0" y="5" width="900" height="2.5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="0" y="7.5" width="900" height="2.5" fill="#F5A9B8" opacity="0.6"/>
    <rect x="0" y="10" width="900" height="2.5" fill="#5BCEFA" opacity="0.6"/>
  </g>

  <!-- Seigaiha wave pattern at bottom -->
  <g class="wave-pattern">
    <g transform="translate(0, 120)">
      <circle cx="0" cy="0" r="18" fill="none" stroke="#DB1C0D" stroke-width="1"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#DB1C0D" stroke-width="1"/>
      <circle cx="36" cy="0" r="18" fill="none" stroke="#DB1C0D" stroke-width="1"/>
      <circle cx="36" cy="0" r="12" fill="none" stroke="#DB1C0D" stroke-width="1"/>
      <circle cx="72" cy="0" r="18" fill="none" stroke="#DB1C0D" stroke-width="1"/>
      <circle cx="72" cy="0" r="12" fill="none" stroke="#DB1C0D" stroke-width="1"/>
      <circle cx="108" cy="0" r="18" fill="none" stroke="#DB1C0D" stroke-width="1"/>
      <circle cx="108" cy="0" r="12" fill="none" stroke="#DB1C0D" stroke-width="1"/>
      <circle cx="144" cy="0" r="18" fill="none" stroke="#DB1C0D" stroke-width="1"/>
      <circle cx="144" cy="0" r="12" fill="none" stroke="#DB1C0D" stroke-width="1"/>
      <circle cx="180" cy="0" r="18" fill="none" stroke="#DB1C0D" stroke-width="1"/>
      <circle cx="180" cy="0" r="12" fill="none" stroke="#DB1C0D" stroke-width="1"/>
    </g>
  </g>
  
  <!-- Floating petals -->
  <ellipse class="float-petal" cx="100" cy="70" rx="3" ry="5" opacity="0.15"/>
  <ellipse class="float-petal" cx="750" cy="50" rx="4" ry="5" opacity="0.1" style="animation-delay: 2s"/>
  <ellipse class="float-petal" cx="400" cy="90" rx="3" ry="4" opacity="0.12" style="animation-delay: 4s"/>
  
  <!-- Content -->
  <text class="footer-text" x="450" y="52" text-anchor="middle">TAKE YOUR TIME · NEVER STOP LEARNING</text>
  <text class="footer-kanji" x="450" y="75" text-anchor="middle">七転び八起き — Fall seven times, stand up eight</text>
  
  <g class="footer-heart" transform="translate(450, 98)">
    <text text-anchor="middle" font-size="16" fill="#DB1C0D">🌸</text>
  </g>
  
  <text class="footer-brand" x="450" y="128" text-anchor="middle">SICKIALLY © 2026</text>
</svg>
