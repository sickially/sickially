<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141022"/>
      <stop offset="100%" stop-color="#110d1c"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <style>
    /* Gradual translation switch for about lines */
    @keyframes lineJp {
      0%, 42% { opacity: 1; transform: translateY(0); }
      48%, 94% { opacity: 0; transform: translateY(-3px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes lineEn {
      0%, 42% { opacity: 0; transform: translateY(3px); }
      48%, 94% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(3px); }
    }
    .row-jp { animation: lineJp 10s ease-in-out infinite; }
    .row-en { animation: lineEn 10s ease-in-out infinite; }

    .line-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif;
      font-size: 15px;
      fill: #DDD6FE;
    }
    .highlight { fill: #C084FC; font-weight: 600; }
  </style>

  <!-- Background card -->
  <rect x="0" y="0" width="900" height="280" rx="12" fill="url(#cardGrad)" stroke="#2E2445" stroke-width="1.5"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="280" rx="2.5" fill="url(#borderGrad)"/>

  <!-- Subtle Trans flag indicator (top right) -->
  <g opacity="0.65" transform="translate(800, 16)">
    <rect x="0" y="0" width="70" height="3.5" rx="1.5" fill="#5BCEFA"/>
    <rect x="0" y="5.5" width="70" height="3.5" rx="1.5" fill="#F5A9B8"/>
    <rect x="0" y="11" width="70" height="3.5" rx="1.5" fill="#FFFFFF"/>
    <rect x="0" y="16.5" width="70" height="3.5" rx="1.5" fill="#F5A9B8"/>
    <rect x="0" y="22" width="70" height="3.5" rx="1.5" fill="#5BCEFA"/>
  </g>

  <!-- Kanji watermark in background -->
  <text x="800" y="220" font-family="serif" font-size="110" fill="#C084FC" opacity="0.04" text-anchor="middle">心</text>

  <!-- Content Lines with bilingual smooth translation -->
  <!-- Line 1 -->
  <g transform="translate(35, 52)">
    <text class="line-text" x="0" y="0">🏳️‍⚧️</text>
    <g class="row-jp">
      <text class="line-text" x="32" y="0">
        <tspan class="highlight">彼女 (She/Her)</tspan> — 自分らしく堂々とコードを紡ぐトランスガール
      </text>
    </g>
    <g class="row-en">
      <text class="line-text" x="32" y="0">
        <tspan class="highlight">She/Her</tspan> — Trans girl proudly coding her way through life
      </text>
    </g>
  </g>

  <!-- Line 2 -->
  <g transform="translate(35, 92)">
    <text class="line-text" x="0" y="0">⛩️</text>
    <g class="row-jp">
      <text class="line-text" x="32" y="0">
        <tspan class="highlight">フロントエンド開発</tspan> — 心に響く美しいデジタル体験を創り出す
      </text>
    </g>
    <g class="row-en">
      <text class="line-text" x="32" y="0">
        <tspan class="highlight">Front-End Developer</tspan> crafting beautiful digital experiences
      </text>
    </g>
  </g>

  <!-- Line 3 -->
  <g transform="translate(35, 132)">
    <text class="line-text" x="0" y="0">🎵</text>
    <g class="row-jp">
      <text class="line-text" x="32" y="0">
        日々のサウンドトラック: <tspan class="highlight">メタルコア (Metalcore)</tspan>
      </text>
    </g>
    <g class="row-en">
      <text class="line-text" x="32" y="0">
        Soundtrack of choice: <tspan class="highlight">Metalcore</tspan>
      </text>
    </g>
  </g>

  <!-- Line 4 -->
  <g transform="translate(35, 172)">
    <text class="line-text" x="0" y="0">📜</text>
    <g class="row-jp">
      <text class="line-text" x="32" y="0">
        常に学びの道を歩む — <tspan class="highlight">七転び八起き</tspan>
      </text>
    </g>
    <g class="row-en">
      <text class="line-text" x="32" y="0">
        Always walking the path of learning — <tspan class="highlight">Fall 7 times, stand up 8</tspan>
      </text>
    </g>
  </g>

  <!-- Line 5 -->
  <g transform="translate(35, 212)">
    <text class="line-text" x="0" y="0">🌸</text>
    <g class="row-jp">
      <text class="line-text" x="32" y="0">
        全ての出会いは一生に一度の奇跡 — <tspan class="highlight">一期一会</tspan>
      </text>
    </g>
    <g class="row-en">
      <text class="line-text" x="32" y="0">
        Believer that <tspan class="highlight" font-style="italic">every encounter is once in a lifetime</tspan> — 一期一会
      </text>
    </g>
  </g>

  <!-- Line 6 -->
  <g transform="translate(35, 252)">
    <text class="line-text" x="0" y="0">🗾</text>
    <g class="row-jp">
      <text class="line-text" x="32" y="0">
        日本の美学・文化・哲学に深く魅せられて
      </text>
    </g>
    <g class="row-en">
      <text class="line-text" x="32" y="0">
        Fascinated by Japanese culture, art, and philosophy
      </text>
    </g>
  </g>
</svg>
