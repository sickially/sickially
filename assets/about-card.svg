<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270">
  <defs>
    <!-- Fade-slide animation for each line -->
    <style>
      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateX(-18px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes borderGlow {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      @keyframes dotPulse {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.5; }
      }
      @keyframes softFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }
      .line1 { animation: fadeSlideIn 0.6s ease-out 0.2s both; }
      .line2 { animation: fadeSlideIn 0.6s ease-out 0.4s both; }
      .line3 { animation: fadeSlideIn 0.6s ease-out 0.6s both; }
      .line4 { animation: fadeSlideIn 0.6s ease-out 0.8s both; }
      .line5 { animation: fadeSlideIn 0.6s ease-out 1.0s both; }
      .line6 { animation: fadeSlideIn 0.6s ease-out 1.2s both; }
      .accent-border { animation: borderGlow 4s ease-in-out infinite; }
      .ink-dot { animation: dotPulse 5s ease-in-out infinite; }
      .kanji-watermark { animation: softFloat 8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="900" height="270" rx="10" ry="10" fill="#0d0b12" stroke="#201a2d" stroke-width="1.5"/>

  <!-- Trans flag subtle indicator bars (top-right corner) -->
  <g opacity="0.5">
    <rect x="820" y="12" width="65" height="3" rx="1.5" fill="#5BCEFA"/>
    <rect x="820" y="18" width="65" height="3" rx="1.5" fill="#F5A9B8"/>
    <rect x="820" y="24" width="65" height="3" rx="1.5" fill="#FFFFFF"/>
    <rect x="820" y="30" width="65" height="3" rx="1.5" fill="#F5A9B8"/>
    <rect x="820" y="36" width="65" height="3" rx="1.5" fill="#5BCEFA"/>
  </g>

  <!-- Left accent border -->
  <rect class="accent-border" x="0" y="0" width="3.5" height="270" rx="2" fill="#9B72CF"/>

  <!-- Kanji watermark (very low opacity) -->
  <g class="kanji-watermark">
    <text x="780" y="220" font-family="'Yu Mincho', 'Hiragino Mincho Pro', serif" font-size="100" fill="#9B72CF" opacity="0.03" text-anchor="middle">道</text>
  </g>

  <!-- Ink dots in purple (subtle decoration) -->
  <circle class="ink-dot" cx="860" cy="255" r="2" fill="#9B72CF" opacity="0.25" style="animation-delay: 0s;"/>
  <circle class="ink-dot" cx="872" cy="250" r="1.5" fill="#9B72CF" opacity="0.2" style="animation-delay: 1.5s;"/>
  <circle class="ink-dot" cx="850" cy="248" r="1" fill="#9B72CF" opacity="0.15" style="animation-delay: 3s;"/>
  <circle class="ink-dot" cx="878" cy="258" r="1.2" fill="#B48EE0" opacity="0.18" style="animation-delay: 2s;"/>

  <!-- Content lines -->
  <!-- Line 1 -->
  <g class="line1">
    <text x="30" y="48" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="15" fill="#d0d0d0">
      <tspan>🏳️‍⚧️  </tspan>
      <tspan fill="#9B72CF" font-weight="600">She/Her</tspan>
      <tspan> — Trans girl proudly coding her way through life</tspan>
    </text>
  </g>

  <!-- Line 2 -->
  <g class="line2">
    <text x="30" y="90" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="15" fill="#d0d0d0">
      <tspan>⛩️  Front-End Developer crafting beautiful digital experiences</tspan>
    </text>
  </g>

  <!-- Line 3 -->
  <g class="line3">
    <text x="30" y="132" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="15" fill="#d0d0d0">
      <tspan>🎵  Soundtrack of choice: </tspan>
      <tspan fill="#9B72CF" font-weight="600">Metalcore</tspan>
    </text>
  </g>

  <!-- Line 4 -->
  <g class="line4">
    <text x="30" y="174" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="15" fill="#d0d0d0">
      <tspan>📜  Always walking the path of learning — </tspan>
      <tspan fill="#B48EE0" font-family="'Yu Mincho', 'Hiragino Mincho Pro', serif" font-size="15">七転び八起き</tspan>
    </text>
  </g>

  <!-- Line 5 -->
  <g class="line5">
    <text x="30" y="216" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="15" fill="#d0d0d0">
      <tspan>🌸  Believer that </tspan>
      <tspan fill="#9B72CF" font-style="italic">every encounter is once in a lifetime</tspan>
      <tspan> — </tspan>
      <tspan fill="#B48EE0" font-family="'Yu Mincho', 'Hiragino Mincho Pro', serif" font-size="15">一期一会</tspan>
    </text>
  </g>

  <!-- Line 6 -->
  <g class="line6">
    <text x="30" y="252" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="15" fill="#d0d0d0">
      <tspan>🗾  Fascinated by Japanese culture, art, and philosophy</tspan>
    </text>
  </g>
</svg>