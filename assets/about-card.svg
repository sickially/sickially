<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <filter id="paperTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply"/>
    </filter>
  </defs>
  <style>
    @keyframes fadeSlide {
      0% { transform: translateY(10px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes brushDraw {
      0% { stroke-dashoffset: 1800; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes gentleSway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(0.5deg); }
    }
    @keyframes inkDrop {
      0% { r: 0; opacity: 0; }
      50% { opacity: 0.15; }
      100% { r: 6; opacity: 0.08; }
    }
    
    .scroll-bg {
      fill: #0d0d0d;
      stroke: #2a1a1a;
      stroke-width: 1;
      rx: 4;
    }
    .scroll-border-left {
      fill: #DB1C0D;
      opacity: 0.6;
      rx: 2;
    }
    .about-line {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 15px;
      fill: #cccccc;
    }
    .highlight {
      fill: #DB1C0D;
    }
    .line1 { animation: fadeSlide 0.6s ease-out 0.2s both; }
    .line2 { animation: fadeSlide 0.6s ease-out 0.4s both; }
    .line3 { animation: fadeSlide 0.6s ease-out 0.6s both; }
    .line4 { animation: fadeSlide 0.6s ease-out 0.8s both; }
    .line5 { animation: fadeSlide 0.6s ease-out 1.0s both; }
    .line6 { animation: fadeSlide 0.6s ease-out 1.2s both; }
    
    .ink-dot {
      fill: #DB1C0D;
      animation: inkDrop 2s ease-out both;
    }
    
    .trans-bar {
      animation: fadeSlide 0.6s ease-out 0.1s both;
    }
    
    .bamboo {
      stroke: #DB1C0D;
      stroke-width: 1.5;
      fill: none;
      opacity: 0.08;
    }
    .bamboo-leaf {
      fill: #DB1C0D;
      opacity: 0.06;
      animation: gentleSway 6s ease-in-out infinite;
      transform-origin: center bottom;
    }

    .kanji-watermark {
      font-family: 'Georgia', serif;
      font-size: 120px;
      fill: #DB1C0D;
      opacity: 0.03;
    }
  </style>
  
  <!-- Background scroll -->
  <rect class="scroll-bg" width="900" height="280"/>
  
  <!-- Left accent border (like a scroll edge) -->
  <rect class="scroll-border-left" x="0" y="0" width="4" height="280"/>

  <!-- Kanji watermark -->
  <text class="kanji-watermark" x="720" y="220" text-anchor="middle">心</text>

  <!-- Decorative bamboo on right -->
  <g>
    <line class="bamboo" x1="850" y1="0" x2="850" y2="280"/>
    <line class="bamboo" x1="850" y1="60" x2="850" y2="60"/>
    <ellipse class="bamboo" cx="850" cy="60" rx="3" ry="1.5"/>
    <ellipse class="bamboo" cx="850" cy="140" rx="3" ry="1.5"/>
    <ellipse class="bamboo" cx="850" cy="220" rx="3" ry="1.5"/>
    <!-- Leaves -->
    <path class="bamboo-leaf" d="M850,55 Q870,40 865,30 Q855,45 850,55Z"/>
    <path class="bamboo-leaf" d="M850,55 Q830,42 835,30 Q845,43 850,55Z" style="animation-delay: 1s"/>
    <path class="bamboo-leaf" d="M850,135 Q875,120 868,110 Q858,125 850,135Z" style="animation-delay: 2s"/>
    <path class="bamboo-leaf" d="M850,135 Q825,125 832,112 Q842,127 850,135Z"/>
  </g>

  <!-- Trans flag indicator (subtle) -->
  <g class="trans-bar">
    <rect x="25" y="20" width="35" height="3" rx="1" fill="#5BCEFA" opacity="0.7"/>
    <rect x="25" y="24" width="35" height="3" rx="1" fill="#F5A9B8" opacity="0.7"/>
    <rect x="25" y="28" width="35" height="3" rx="1" fill="#FFFFFF" opacity="0.7"/>
    <rect x="25" y="32" width="35" height="3" rx="1" fill="#F5A9B8" opacity="0.7"/>
    <rect x="25" y="36" width="35" height="3" rx="1" fill="#5BCEFA" opacity="0.7"/>
  </g>

  <!-- Ink dots decorative -->
  <circle class="ink-dot" cx="820" cy="30" r="0" style="animation-delay: 0.5s"/>
  <circle class="ink-dot" cx="805" cy="45" r="0" style="animation-delay: 1s"/>
  <circle class="ink-dot" cx="825" cy="55" r="0" style="animation-delay: 1.5s"/>

  <!-- Content -->
  <g class="line1">
    <text class="about-line" x="35" y="75">🏳️‍⚧️</text>
    <text class="about-line" x="65" y="75">She/Her — Trans girl proudly coding her way through life</text>
  </g>
  
  <g class="line2">
    <text class="about-line" x="35" y="110">⛩️</text>
    <text class="about-line" x="65" y="110">Front-End Developer crafting beautiful digital experiences</text>
  </g>
  
  <g class="line3">
    <text class="about-line" x="35" y="145">🎵</text>
    <text class="about-line" x="65" y="145">
      <tspan>Soundtrack of choice: </tspan>
      <tspan class="highlight">Metalcore</tspan>
    </text>
  </g>
  
  <g class="line4">
    <text class="about-line" x="35" y="180">📜</text>
    <text class="about-line" x="65" y="180">Always walking the path of learning — 七転び八起き</text>
  </g>
  
  <g class="line5">
    <text class="about-line" x="35" y="215">🌸</text>
    <text class="about-line" x="65" y="215">
      <tspan>Believer that every encounter is </tspan>
      <tspan class="highlight" font-style="italic">once in a lifetime</tspan>
      <tspan> — 一期一会</tspan>
    </text>
  </g>
  
  <g class="line6">
    <text class="about-line" x="35" y="250">🗾</text>
    <text class="about-line" x="65" y="250">Fascinated by Japanese culture, art, and philosophy</text>
  </g>
</svg>
