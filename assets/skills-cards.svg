<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="skillCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141022"/>
      <stop offset="100%" stop-color="#110e1c"/>
    </linearGradient>
    <linearGradient id="topAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes skillJp {
      0%, 42% { opacity: 1; transform: translateY(0); }
      48%, 94% { opacity: 0; transform: translateY(-2px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes skillEn {
      0%, 42% { opacity: 0; transform: translateY(2px); }
      48%, 94% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(2px); }
    }
    .tag-jp { animation: skillJp 8s ease-in-out infinite; }
    .tag-en { animation: skillEn 8s ease-in-out infinite; }

    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #EDE9FE;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    .card-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', serif;
      font-size: 11px;
      fill: #C084FC;
      letter-spacing: 1px;
    }
    .skill-item {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      fill: #DDD6FE;
    }
    .watermark {
      font-family: serif;
      font-size: 85px;
      fill: #C084FC;
      opacity: 0.04;
    }
  </style>

  <!-- CARD 1: Languages -->
  <g transform="translate(15, 10)">
    <rect width="270" height="180" rx="10" fill="url(#skillCardBg)" stroke="#2E2445" stroke-width="1.2"/>
    <rect width="270" height="3" rx="1.5" fill="url(#topAccent)"/>
    <text x="210" y="145" class="watermark">言</text>

    <!-- Bilingual Header -->
    <g class="tag-jp">
      <text x="22" y="38" class="card-title">言語</text>
      <text x="75" y="38" class="card-sub">• LANGUAGES</text>
    </g>
    <g class="tag-en">
      <text x="22" y="38" class="card-title">LANGUAGES</text>
      <text x="135" y="38" class="card-sub">• 言語</text>
    </g>
    <line x1="22" y1="48" x2="248" y2="48" stroke="#3D2D5E" stroke-width="1"/>

    <!-- Items -->
    <g transform="translate(25, 82)">
      <text x="0" y="0" font-size="16">🟧</text>
      <text class="skill-item" x="26" y="-1">HTML5</text>
    </g>
    <g transform="translate(25, 115)">
      <text x="0" y="0" font-size="16">🔵</text>
      <text class="skill-item" x="26" y="-1">CSS3</text>
    </g>
    <g transform="translate(25, 148)">
      <text x="0" y="0" font-size="16">🟡</text>
      <text class="skill-item" x="26" y="-1">JavaScript</text>
    </g>
  </g>

  <!-- CARD 2: Frameworks -->
  <g transform="translate(315, 10)">
    <rect width="270" height="180" rx="10" fill="url(#skillCardBg)" stroke="#2E2445" stroke-width="1.2"/>
    <rect width="270" height="3" rx="1.5" fill="url(#topAccent)"/>
    <text x="510" y="145" class="watermark">骨</text>

    <g class="tag-jp">
      <text x="22" y="38" class="card-title">骨組み</text>
      <text x="90" y="38" class="card-sub">• FRAMEWORKS</text>
    </g>
    <g class="tag-en">
      <text x="22" y="38" class="card-title">FRAMEWORKS</text>
      <text x="150" y="38" class="card-sub">• 骨組み</text>
    </g>
    <line x1="22" y1="48" x2="248" y2="48" stroke="#3D2D5E" stroke-width="1"/>

    <g transform="translate(25, 82)">
      <text x="0" y="0" font-size="16">⚛️</text>
      <text class="skill-item" x="26" y="-1">React</text>
    </g>
  </g>

  <!-- CARD 3: Tools -->
  <g transform="translate(615, 10)">
    <rect width="270" height="180" rx="10" fill="url(#skillCardBg)" stroke="#2E2445" stroke-width="1.2"/>
    <rect width="270" height="3" rx="1.5" fill="url(#topAccent)"/>
    <text x="810" y="145" class="watermark">具</text>

    <g class="tag-jp">
      <text x="22" y="38" class="card-title">道具</text>
      <text x="75" y="38" class="card-sub">• TOOLS</text>
    </g>
    <g class="tag-en">
      <text x="22" y="38" class="card-title">TOOLS</text>
      <text x="95" y="38" class="card-sub">• 道具</text>
    </g>
    <line x1="22" y1="48" x2="248" y2="48" stroke="#3D2D5E" stroke-width="1"/>

    <g transform="translate(25, 82)">
      <text x="0" y="0" font-size="16">💻</text>
      <text class="skill-item" x="26" y="-1">VS Code</text>
    </g>
    <g transform="translate(25, 115)">
      <text x="0" y="0" font-size="16">🚀</text>
      <text class="skill-item" x="26" y="-1">Antigravity</text>
    </g>
    <g transform="translate(25, 148)">
      <text x="0" y="0" font-size="16">🔀</text>
      <text class="skill-item" x="26" y="-1">Git</text>
    </g>
  </g>
</svg>
