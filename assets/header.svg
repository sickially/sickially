<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120e1c"/>
      <stop offset="50%" stop-color="#181326"/>
      <stop offset="100%" stop-color="#100c19"/>
    </linearGradient>

    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#9B72CF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#9B72CF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="moonSurface" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="60%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </radialGradient>

    <clipPath id="headerClip">
      <rect width="900" height="320" rx="12"/>
    </clipPath>
  </defs>

  <style>
    /* Falling sakura petals animation */
    @keyframes sakuraFall1 {
      0%   { transform: translate(0, -20px) rotate(0deg); opacity: 0; }
      15%  { opacity: 0.85; }
      85%  { opacity: 0.7; }
      100% { transform: translate(70px, 340px) rotate(340deg); opacity: 0; }
    }
    @keyframes sakuraFall2 {
      0%   { transform: translate(0, -20px) rotate(0deg); opacity: 0; }
      15%  { opacity: 0.75; }
      85%  { opacity: 0.6; }
      100% { transform: translate(-50px, 340px) rotate(260deg); opacity: 0; }
    }
    @keyframes sakuraFall3 {
      0%   { transform: translate(0, -20px) rotate(0deg); opacity: 0; }
      15%  { opacity: 0.9; }
      85%  { opacity: 0.65; }
      100% { transform: translate(40px, 340px) rotate(380deg); opacity: 0; }
    }

    .petal { fill: #C084FC; }
    .p1 { animation: sakuraFall1 9s ease-in-out infinite; }
    .p2 { animation: sakuraFall2 11s ease-in-out 1.5s infinite; }
    .p3 { animation: sakuraFall3 10s ease-in-out 3s infinite; }
    .p4 { animation: sakuraFall1 12s ease-in-out 4.5s infinite; }
    .p5 { animation: sakuraFall2 8.5s ease-in-out 0.8s infinite; }
    .p6 { animation: sakuraFall3 13s ease-in-out 5s infinite; }
    .p7 { animation: sakuraFall1 10.5s ease-in-out 2.5s infinite; }
    .p8 { animation: sakuraFall2 9.5s ease-in-out 6s infinite; }

    /* Japanese to English gradual translation animations */
    @keyframes showJp {
      0%, 42% { opacity: 1; transform: translateY(0); }
      48%, 94% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes showEn {
      0%, 42% { opacity: 0; transform: translateY(4px); }
      48%, 94% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(4px); }
    }

    .trans-jp {
      animation: showJp 9s ease-in-out infinite;
    }
    .trans-en {
      animation: showEn 9s ease-in-out infinite;
    }

    /* Enso rotation */
    @keyframes ensoRot {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .enso-circle {
      transform-origin: 750px 85px;
      animation: ensoRot 80s linear infinite;
    }

    /* Star twinkle */
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.9; }
    }
    .star { animation: twinkle 4s ease-in-out infinite; }
  </style>

  <g clip-path="url(#headerClip)">
    <!-- Base background -->
    <rect width="900" height="320" fill="url(#headerBg)"/>

    <!-- Subtle stars -->
    <g fill="#E9D5FF">
      <circle cx="120" cy="40" r="1" class="star" style="animation-delay: 0s;"/>
      <circle cx="280" cy="70" r="0.8" class="star" style="animation-delay: 1.2s;"/>
      <circle cx="410" cy="35" r="1.2" class="star" style="animation-delay: 2.1s;"/>
      <circle cx="560" cy="55" r="0.7" class="star" style="animation-delay: 0.6s;"/>
      <circle cx="680" cy="30" r="1" class="star" style="animation-delay: 1.8s;"/>
      <circle cx="840" cy="65" r="0.9" class="star" style="animation-delay: 2.8s;"/>
      <circle cx="70" cy="110" r="0.8" class="star" style="animation-delay: 3.2s;"/>
      <circle cx="860" cy="130" r="1.1" class="star" style="animation-delay: 0.4s;"/>
    </g>

    <!-- Moon Glow & Moon -->
    <circle cx="750" cy="85" r="75" fill="url(#moonGlow)"/>
    <circle cx="750" cy="85" r="32" fill="url(#moonSurface)"/>
    <circle cx="760" cy="78" r="26" fill="#151022" opacity="0.4"/>

    <!-- Enso Zen Circle -->
    <g class="enso-circle" opacity="0.4">
      <circle cx="750" cy="85" r="48" fill="none" stroke="#C084FC" stroke-width="1.5"
              stroke-dasharray="210 40 20 15" stroke-linecap="round"/>
    </g>

    <!-- Mountains silhouette -->
    <polygon points="0,250 110,185 220,225 360,165 480,215 590,175 700,210 810,170 900,220 900,320 0,320" fill="#171224" opacity="0.6"/>
    <polygon points="0,270 90,220 190,250 310,195 430,240 540,210 660,235 770,205 900,250 900,320 0,320" fill="#1d172e" opacity="0.75"/>

    <!-- Elegant Torii Silhouette in purple accent -->
    <g transform="translate(140, 195) scale(0.65)" opacity="0.5">
      <rect x="0" y="15" width="6" height="75" rx="1" fill="#C084FC"/>
      <rect x="58" y="15" width="6" height="75" rx="1" fill="#C084FC"/>
      <rect x="-10" y="0" width="84" height="6" rx="2" fill="#C084FC"/>
      <rect x="-6" y="6" width="76" height="4" rx="1" fill="#C084FC"/>
      <rect x="3" y="18" width="58" height="4" rx="1" fill="#C084FC"/>
    </g>

    <!-- Sakura petals falling -->
    <g>
      <ellipse class="petal p1" cx="90" cy="0" rx="3.5" ry="5.5" opacity="0.75"/>
      <ellipse class="petal p2" cx="230" cy="0" rx="4" ry="6" opacity="0.65"/>
      <ellipse class="petal p3" cx="370" cy="0" rx="3" ry="5" opacity="0.8"/>
      <ellipse class="petal p4" cx="520" cy="0" rx="4.5" ry="6.5" opacity="0.7"/>
      <ellipse class="petal p5" cx="640" cy="0" rx="3.5" ry="5" opacity="0.65"/>
      <ellipse class="petal p6" cx="780" cy="0" rx="4" ry="6" opacity="0.75"/>
      <ellipse class="petal p7" cx="160" cy="0" rx="3" ry="5" opacity="0.6"/>
      <ellipse class="petal p8" cx="460" cy="0" rx="4" ry="5.5" opacity="0.7"/>
    </g>

    <!-- ============================================== -->
    <!-- TEXT CONTENT WITH JP -> EN GRADUAL TRANSLATION -->
    <!-- ============================================== -->

    <!-- Top Badge / Proverb with translation -->
    <!-- Japanese version -->
    <g class="trans-jp">
      <text x="450" y="85" text-anchor="middle" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Serif JP', serif" font-size="14" letter-spacing="4">
        一期一会  —  出会いを大切に
      </text>
    </g>
    <!-- English translation -->
    <g class="trans-en">
      <text x="450" y="85" text-anchor="middle" fill="#E9D5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" letter-spacing="3" font-weight="500">
        TREASURE EVERY ENCOUNTER  —  ONCE IN A LIFETIME
      </text>
    </g>

    <!-- Main Name -->
    <text x="450" y="150" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="52" font-weight="700" letter-spacing="14">
      SICKIALLY
    </text>

    <!-- Delicate purple line below name -->
    <line x1="320" y1="168" x2="580" y2="168" stroke="#9B72CF" stroke-width="1.5" opacity="0.6"/>
    <circle cx="450" cy="168" r="3" fill="#C084FC"/>

    <!-- Subtitle with translation -->
    <g class="trans-jp">
      <text x="450" y="200" text-anchor="middle" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" letter-spacing="5">
        フロントエンドエンジニア
      </text>
    </g>
    <g class="trans-en">
      <text x="450" y="200" text-anchor="middle" fill="#D8B4FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" letter-spacing="6" font-weight="500">
        FRONT-END DEVELOPER
      </text>
    </g>

    <!-- Nietzsche Quote with translation -->
    <g class="trans-jp">
      <text x="450" y="245" text-anchor="middle" fill="#DDD6FE" font-family="Georgia, serif" font-size="13" font-style="italic" opacity="0.9">
        「音楽がなければ、人生は誤謬である。」
      </text>
      <text x="450" y="268" text-anchor="middle" fill="#A79BB7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" letter-spacing="1">
        — フリードリヒ・ニーチェ
      </text>
    </g>
    <g class="trans-en">
      <text x="450" y="245" text-anchor="middle" fill="#DDD6FE" font-family="Georgia, serif" font-size="13" font-style="italic" opacity="0.9">
        "Without music, life would be a mistake."
      </text>
      <text x="450" y="268" text-anchor="middle" fill="#A79BB7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" letter-spacing="1">
        — Friedrich Nietzsche, Twilight of the Idols
      </text>
    </g>
  </g>
</svg>
