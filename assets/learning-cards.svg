<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130">
  <defs>
    <linearGradient id="learnCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141022"/>
      <stop offset="100%" stop-color="#110e1c"/>
    </linearGradient>
    <linearGradient id="purpleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes dotBlink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes learnJp {
      0%, 42% { opacity: 1; transform: translateY(0); }
      48%, 94% { opacity: 0; transform: translateY(-2px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes learnEn {
      0%, 42% { opacity: 0; transform: translateY(2px); }
      48%, 94% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(2px); }
    }
    .status-dot { fill: #C084FC; animation: dotBlink 2s ease-in-out infinite; }
    .learn-jp { animation: learnJp 8s ease-in-out infinite; }
    .learn-en { animation: learnEn 8s ease-in-out infinite; }

    .tech-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: #EDE9FE;
    }
    .tech-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', serif;
      font-size: 11px;
      fill: #C084FC;
      letter-spacing: 1px;
    }
    .status-lbl {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px;
      fill: #C084FC;
      font-weight: 500;
      letter-spacing: 1px;
    }
  </style>

  <!-- CARD 1: Ruby -->
  <g transform="translate(15, 10)">
    <rect width="270" height="110" rx="10" fill="url(#learnCardBg)" stroke="#2E2445" stroke-width="1.2"/>
    <rect width="270" height="3" rx="1.5" fill="url(#purpleBar)"/>

    <text x="25" y="42" font-size="22">💎</text>
    <text x="58" y="38" class="tech-name">Ruby</text>
    <text x="108" y="38" class="tech-sub">ルビー</text>

    <!-- Progress bar -->
    <rect x="25" y="56" width="220" height="7" rx="3.5" fill="#231B36"/>
    <rect x="25" y="56" width="145" height="7" rx="3.5" fill="url(#purpleBar)"/>

    <!-- Status with translation -->
    <circle cx="28" cy="88" r="3.5" class="status-dot"/>
    <g class="learn-jp">
      <text x="40" y="92" class="status-lbl">修行中 (学習進行中...)</text>
    </g>
    <g class="learn-en">
      <text x="40" y="92" class="status-lbl">In Progress — 65%</text>
    </g>
  </g>

  <!-- CARD 2: Python -->
  <g transform="translate(315, 10)">
    <rect width="270" height="110" rx="10" fill="url(#learnCardBg)" stroke="#2E2445" stroke-width="1.2"/>
    <rect width="270" height="3" rx="1.5" fill="url(#purpleBar)"/>

    <text x="25" y="42" font-size="22">🐍</text>
    <text x="58" y="38" class="tech-name">Python</text>
    <text x="122" y="38" class="tech-sub">パイソン</text>

    <rect x="25" y="56" width="220" height="7" rx="3.5" fill="#231B36"/>
    <rect x="25" y="56" width="110" height="7" rx="3.5" fill="url(#purpleBar)"/>

    <circle cx="28" cy="88" r="3.5" class="status-dot" style="animation-delay: 0.5s;"/>
    <g class="learn-jp">
      <text x="40" y="92" class="status-lbl">修行中 (基礎修得中...)</text>
    </g>
    <g class="learn-en">
      <text x="40" y="92" class="status-lbl">In Progress — 50%</text>
    </g>
  </g>

  <!-- CARD 3: Svelte -->
  <g transform="translate(615, 10)">
    <rect width="270" height="110" rx="10" fill="url(#learnCardBg)" stroke="#2E2445" stroke-width="1.2"/>
    <rect width="270" height="3" rx="1.5" fill="url(#purpleBar)"/>

    <text x="25" y="42" font-size="22">🔥</text>
    <text x="58" y="38" class="tech-name">Svelte</text>
    <text x="116" y="38" class="tech-sub">スベルト</text>

    <rect x="25" y="56" width="220" height="7" rx="3.5" fill="#231B36"/>
    <rect x="25" y="56" width="85" height="7" rx="3.5" fill="url(#purpleBar)"/>

    <circle cx="28" cy="88" r="3.5" class="status-dot" style="animation-delay: 1s;"/>
    <g class="learn-jp">
      <text x="40" y="92" class="status-lbl">修行中 (探求開始...)</text>
    </g>
    <g class="learn-en">
      <text x="40" y="92" class="status-lbl">In Progress — 40%</text>
    </g>
  </g>
</svg>
