<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 45" width="900" height="45">
  <style>
    @keyframes brushStroke {
      0% { transform: scaleX(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: scaleX(1); opacity: 1; }
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(5px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .section-brush {
      fill: #9B72CF;
      transform-origin: left center;
      animation: brushStroke 1s ease-out both;
      opacity: 0.7;
    }
    .section-title {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 22px;
      fill: #ffffff;
      letter-spacing: 4px;
      animation: fadeIn 0.8s ease-out 0.3s both;
    }
    .section-jp {
      font-family: 'Segoe UI', serif;
      font-size: 14px;
      fill: #B48EE0;
      opacity: 0.5;
      animation: fadeIn 0.8s ease-out 0.5s both;
    }
    .section-line {
      stroke: #9B72CF;
      stroke-width: 1;
      opacity: 0.2;
      transform-origin: left center;
      animation: brushStroke 1.2s ease-out 0.5s both;
    }
  </style>
  <rect width="900" height="45" fill="transparent"/>

  <!-- Brush stroke accent under title -->
  <rect class="section-brush" x="20" y="34" width="170" height="3" rx="1.5"/>

  <!-- Japanese text + English title -->
  <text class="section-jp" x="22" y="18">戦績</text>
  <text class="section-title" x="58" y="18">— STATS</text>

  <!-- Decorative line -->
  <line class="section-line" x1="200" y1="35" x2="880" y2="35"/>
</svg>
