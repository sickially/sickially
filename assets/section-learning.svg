<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 48" width="900" height="48">
  <defs>
    <linearGradient id="brushGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseLine {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }
    @keyframes switchTitleJp {
      0%, 42% { opacity: 1; transform: translateY(0); }
      48%, 94% { opacity: 0; transform: translateY(-3px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes switchTitleEn {
      0%, 42% { opacity: 0; transform: translateY(3px); }
      48%, 94% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(3px); }
    }
    .anim-jp { animation: switchTitleJp 8s ease-in-out infinite; }
    .anim-en { animation: switchTitleEn 8s ease-in-out infinite; }
    .sep-line { animation: pulseLine 4s ease-in-out infinite; }
  </style>

  <!-- Title container -->
  <g>
    <!-- Japanese Title state -->
    <g class="anim-jp">
      <text x="25" y="30" fill="#EDE9FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Serif JP', serif" font-size="21" font-weight="600" letter-spacing="3">
        修行中
      </text>
      <text x="340" y="29" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" letter-spacing="2" opacity="0.8">
        — CURRENTLY LEARNING
      </text>
    </g>

    <!-- English Title state -->
    <g class="anim-en">
      <text x="25" y="30" fill="#EDE9FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="4">
        CURRENTLY LEARNING
      </text>
      <text x="340" y="29" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', serif" font-size="13" font-weight="500" letter-spacing="2" opacity="0.8">
        — 修行中
      </text>
    </g>

    <!-- Purple brush stroke underline -->
    <rect x="25" y="38" width="360" height="3" rx="1.5" fill="url(#brushGrad)" opacity="0.85"/>
    <circle cx="389" cy="39.5" r="2" fill="#C084FC"/>

    <!-- Decorative subtle trailing line -->
    <line class="sep-line" x1="397" y1="39.5" x2="880" y2="39.5" stroke="url(#lineGrad)" stroke-width="1.5"/>
  </g>
</svg>
