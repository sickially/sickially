name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake Game
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sickially
          outputs: |
            dist/github-snake.svg?color_snake=#8B5CF6&color_dots=#ebedf0,#e9d5ff,#c084fc,#9333ea,#6b21a8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D8B4FE&color_dots=#1e192e,#442e6d,#7346b3,#a86de8,#d8b4fe

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
